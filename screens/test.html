<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ARIN — Test</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#111318;--surface:#1a1d24;--surface-c:#1e2128;--surface-h:#252830;
  --fg:#e8eaed;--fg2:#9aa0a6;--muted:#5f6368;--border:#2a2d36;
  --accent:#00f0ff;--accent-d:rgba(0,240,255,.15);
  --sec:#7000ff;--sec-d:rgba(112,0,255,.15);
  --ter:#00f990;--ter-d:rgba(0,249,144,.15);
  --err:#ff4757;--warn:#ffc048;
  --fd:'Hanken Grotesk',system-ui,sans-serif;
  --fb:'Inter',system-ui,sans-serif;
  --fm:'JetBrains Mono',ui-monospace,monospace;
  --r-sm:8px;--r-md:12px;--r-lg:16px;--r-full:999px;
}
html,body{width:100%;height:100%;background:var(--bg);color:var(--fg);font-family:var(--fb);overflow:hidden;-webkit-font-smoothing:antialiased}

.device{width:100%;height:100%;display:flex;flex-direction:column;background:var(--bg);position:relative;overflow:hidden}
.status-bar{height:32px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-family:var(--fm);font-size:12px;color:var(--fg2);flex-shrink:0;z-index:10}
.gesture-bar{height:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.gesture-bar::after{content:'';width:120px;height:4px;background:var(--fg2);border-radius:999px;opacity:.4}

.app{flex:1;display:flex;flex-direction:column;overflow:hidden}

/* Status strip */
.status-strip{display:flex;gap:8px;padding:8px 16px;border-bottom:1px solid var(--border);flex-shrink:0}
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:var(--r-full);font-family:var(--fm);font-size:10px;text-transform:uppercase;letter-spacing:.05em;background:var(--surface);border:1px solid var(--border)}
.badge .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.badge.ok .dot{background:var(--ter);box-shadow:0 0 8px var(--ter)}
.badge.wait .dot{background:var(--warn);animation:pulse 1.5s infinite}

/* Command grid */
.cmd-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;padding:12px 16px;flex-shrink:0}
.cmd-card{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);cursor:pointer;transition:all .15s;position:relative;overflow:hidden}
.cmd-card:active{transform:scale(.95);border-color:var(--accent);background:var(--accent-d)}
.cmd-card .ico{font-size:22px}
.cmd-card .lbl{font-size:11px;font-family:var(--fm);color:var(--fg2);text-transform:uppercase;letter-spacing:.04em}
.cmd-card .check{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--ter-d);opacity:0;transition:opacity .3s;pointer-events:none;font-size:24px;color:var(--ter)}
.cmd-card.flash .check{opacity:1}

/* Log console */
.log-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden;border-top:1px solid var(--border)}
.log-header{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;border-bottom:1px solid var(--border);flex-shrink:0}
.log-header span{font-family:var(--fm);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.log{flex:1;overflow-y:auto;padding:8px 16px;font-family:var(--fm);font-size:12px;line-height:1.8;-webkit-overflow-scrolling:touch}
.log::-webkit-scrollbar{width:0}
.log-line{animation:slideIn .3s ease-out;white-space:pre-wrap;word-break:break-all}
.log-line.info{color:var(--fg2)}
.log-line.ok{color:var(--ter)}
.log-line.err{color:var(--err)}
.log-line.warn{color:var(--warn)}
.log-line .ts{color:var(--muted);margin-right:8px}

/* Input */
.cmd-input-wrap{display:flex;gap:8px;padding:10px 16px;border-top:1px solid var(--border);flex-shrink:0}
.cmd-input{flex:1;padding:10px 14px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--border);color:var(--fg);font-size:13px;font-family:var(--fm);outline:none;transition:border-color .2s}
.cmd-input:focus{border-color:var(--accent)}
.cmd-input::placeholder{color:var(--muted)}

/* Run button with spinner morph */
.run-btn{padding:10px 20px;border:none;border-radius:var(--r-md);background:var(--accent);color:var(--bg);font-family:var(--fm);font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;text-transform:uppercase;letter-spacing:.05em;min-width:80px;display:flex;align-items:center;justify-content:center;gap:6px}
.run-btn:active{transform:scale(.95)}
.run-btn.loading{pointer-events:none;opacity:.7}
.run-btn .spinner{width:14px;height:14px;border:2px solid transparent;border-top-color:var(--bg);border-radius:50%;animation:spin .6s linear infinite;display:none}
.run-btn.loading .spinner{display:block}
.run-btn.loading .btn-label{display:none}
.run-btn.done{background:var(--ter)}
.run-btn.fail{background:var(--err)}

/* Nav */
.nav{display:flex;border-top:1px solid var(--border);flex-shrink:0;padding-bottom:env(safe-area-inset-bottom,0)}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;text-decoration:none;color:var(--muted);font-size:10px;font-family:var(--fb);transition:color .2s;position:relative}
.nav-item.active{color:var(--accent)}
.nav-item.active::before{content:'';position:absolute;top:0;left:25%;right:25%;height:2px;background:var(--accent);border-radius:0 0 2px 2px}
.nav-item svg{width:22px;height:22px}

@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes slideIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="device">
  <div class="status-bar">
    <span id="time">12:00</span>
    <span style="display:flex;gap:6px;align-items:center">
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><path d="M1 8h2v4H1zM5 5h2v7H5zM9 3h2v9H9zM13 0h2v12h-2z" fill="currentColor" opacity=".6"/></svg>
      <svg width="22" height="12" viewBox="0 0 22 12" fill="none"><rect x=".5" y=".5" width="18" height="11" rx="2" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="14" height="8" rx="1" fill="var(--ter)" opacity=".8"/><path d="M20 4v4a2 2 0 000-4z" fill="currentColor" opacity=".4"/></svg>
    </span>
  </div>

  <div class="app">
    <div class="status-strip">
      <span class="badge ok"><span class="dot"></span>Local AI</span>
      <span class="badge ok"><span class="dot"></span>Cloud AI</span>
      <span class="badge ok"><span class="dot"></span>Arduino</span>
    </div>

    <div class="cmd-grid" id="cmdGrid">
      <div class="cmd-card" onclick="runCmd('forward')"><div class="ico">&#11014;</div><div class="lbl">Forward</div><div class="check">&#10003;</div></div>
      <div class="cmd-card" onclick="runCmd('backward')"><div class="ico">&#11015;</div><div class="lbl">Backward</div><div class="check">&#10003;</div></div>
      <div class="cmd-card" onclick="runCmd('left')"><div class="ico">&#11012;</div><div class="lbl">Left</div><div class="check">&#10003;</div></div>
      <div class="cmd-card" onclick="runCmd('right')"><div class="ico">&#10145;</div><div class="lbl">Right</div><div class="check">&#10003;</div></div>
      <div class="cmd-card" onclick="runCmd('stop')"><div class="ico">&#9209;</div><div class="lbl">Stop</div><div class="check">&#10003;</div></div>
      <div class="cmd-card" onclick="runCmd('scan')"><div class="ico">&#128225;</div><div class="lbl">Scan</div><div class="check">&#10003;</div></div>
    </div>

    <div class="log-wrap">
      <div class="log-header"><span>Live Console</span><span id="logCount">0 entries</span></div>
      <div class="log" id="log"></div>
    </div>

    <div class="cmd-input-wrap">
      <input class="cmd-input" id="cmdIn" placeholder="Type a command..." onkeydown="if(event.key==='Enter')execCmd()">
      <button class="run-btn" id="runBtn" onclick="execCmd()">
        <span class="spinner"></span>
        <span class="btn-label">Run</span>
      </button>
    </div>

    <nav class="nav">
      <a class="nav-item" href="dashboard.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        <span>Dashboard</span>
      </a>
      <a class="nav-item active" href="test.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
        <span>Test</span>
      </a>
      <a class="nav-item" href="controller.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="12" rx="3"/><circle cx="8" cy="12" r="1.5" fill="currentColor"/><circle cx="16" cy="10" r="1" fill="currentColor"/><circle cx="18" cy="12" r="1" fill="currentColor"/><circle cx="16" cy="14" r="1" fill="currentColor"/><circle cx="14" cy="12" r="1" fill="currentColor"/></svg>
        <span>Controller</span>
      </a>
      <a class="nav-item" href="settings.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        <span>Settings</span>
      </a>
    </nav>
  </div>
  <div class="gesture-bar"></div>
</div>
<script>
(function(){
  var log=document.getElementById('log'),count=document.getElementById('logCount'),entries=0;
  var cmdNames={forward:'CMD_MOVE_FORWARD',backward:'CMD_MOVE_BACKWARD',left:'CMD_TURN_LEFT',right:'CMD_TURN_RIGHT',stop:'CMD_STOP',scan:'CMD_SCAN'};
  var cmdResponses={forward:'Motor L+R: +200ms, heading 0deg',backward:'Motor L+R: -200ms, heading 180deg',left:'Motor L: -150, R: +150',right:'Motor L: +150, R: -150',stop:'All motors halted',scan:'Ultrasonic sweep: 0-180deg, 3 targets found'};

  function ts(){var n=new Date();return String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0')+':'+String(n.getSeconds()).padStart(2,'0')}
  function addLog(text,cls){
    var d=document.createElement('div');d.className='log-line '+(cls||'info');
    d.innerHTML='<span class="ts">'+ts()+'</span>'+text;
    log.appendChild(d);log.scrollTop=log.scrollHeight;entries++;count.textContent=entries+' entries';
  }

  addLog('Console initialized. All connections active.','ok');
  addLog('BLE device: ARIN-BOT-042 [connected]','info');
  addLog('Local model: llama-3.2-1B [ready, 23ms avg]','info');

  window.runCmd=function(cmd){
    var card=document.querySelector('[onclick="runCmd(\''+cmd+'\')"]').closest('.cmd-card');
    card.classList.add('flash');setTimeout(function(){card.classList.remove('flash')},600);
    addLog('>> '+cmdNames[cmd],'info');
    setTimeout(function(){addLog(cmdResponses[cmd],'ok')},200+Math.random()*300);
  };

  window.execCmd=function(){
    var inp=document.getElementById('cmdIn'),btn=document.getElementById('runBtn'),val=inp.value.trim();
    if(!val)return;inp.value='';
    /* show spinner */
    btn.classList.add('loading');btn.classList.remove('done','fail');
    addLog('>> '+val.toUpperCase(),'info');
    setTimeout(function(){
      var ok=Math.random()>.15;
      addLog(ok?'ACK: Command executed successfully':'ERR: Command not recognized — try a valid motor command',ok?'ok':'err');
      btn.classList.remove('loading');
      btn.classList.add(ok?'done':'fail');
      setTimeout(function(){btn.classList.remove('done','fail')},1200);
    },400+Math.random()*600);
  };

  var now=new Date();document.getElementById('time').textContent=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
})();
</script>
</body>
</html>
