<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ARIN — Boot</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#111318;--surface:#1a1d24;--surface-c:#1e2128;--surface-h:#252830;
  --fg:#e8eaed;--fg2:#9aa0a6;--muted:#5f6368;--border:#2a2d36;
  --accent:#00f0ff;--accent-d:rgba(0,240,255,.15);
  --sec:#7000ff;--sec-d:rgba(112,0,255,.15);
  --ter:#00f990;--ter-d:rgba(0,249,144,.15);
  --err:#ff4757;--warn:#ffc048;
  --fd:'Hanken Grotesk',system-ui,sans-serif;
  --fb:'Inter',system-ui,sans-serif;
  --fm:'JetBrains Mono',ui-monospace,monospace;
}
html,body{width:100%;height:100%;background:var(--bg);color:var(--fg);font-family:var(--fb);overflow:hidden;-webkit-font-smoothing:antialiased}

.device{width:100%;height:100%;display:flex;flex-direction:column;background:var(--bg);position:relative;overflow:hidden}
.status-bar{height:32px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-family:var(--fm);font-size:12px;color:var(--fg2);flex-shrink:0;z-index:10}
.gesture-bar{height:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.gesture-bar::after{content:'';width:120px;height:4px;background:var(--fg2);border-radius:999px;opacity:.4}

.splash{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;position:relative}

.logo-wrap{position:relative;width:220px;height:220px;display:flex;align-items:center;justify-content:center}
.logo-text{font-family:var(--fd);font-size:56px;font-weight:800;letter-spacing:.08em;color:var(--fg);z-index:2;animation:breathe 3s ease-in-out infinite}

/* Rotating rings */
.ring{position:absolute;border-radius:50%;border:1.5px solid transparent;opacity:0;transition:opacity 1.2s ease}
.ring.on{opacity:1}
.ring-1{inset:8px;border-top-color:var(--accent);border-right-color:rgba(0,240,255,.35);animation:spin 8s linear infinite}
.ring-2{inset:-4px;border-bottom-color:var(--sec);border-left-color:rgba(112,0,255,.25);animation:spin 12s linear infinite reverse;border-width:1px}
.ring-3{inset:-18px;border-right-color:rgba(0,249,144,.15);animation:spin 16s linear infinite;border-width:.5px}

/* Particle dots orbiting the logo */
.particles{position:absolute;inset:0;animation:spin 20s linear infinite}
.particle{position:absolute;width:4px;height:4px;border-radius:50%;background:var(--accent);opacity:0;transition:opacity .8s ease}
.particle.on{opacity:1}
.particle:nth-child(1){top:5%;left:50%;box-shadow:0 0 6px var(--accent)}
.particle:nth-child(2){top:20%;right:8%;background:var(--sec);box-shadow:0 0 6px var(--sec)}
.particle:nth-child(3){bottom:15%;right:10%;box-shadow:0 0 6px var(--accent)}
.particle:nth-child(4){bottom:5%;left:50%;background:var(--ter);box-shadow:0 0 6px var(--ter)}
.particle:nth-child(5){top:20%;left:8%;box-shadow:0 0 6px var(--accent)}
.particle:nth-child(6){bottom:30%;left:2%;background:var(--sec);box-shadow:0 0 6px var(--sec);width:3px;height:3px}
.particle:nth-child(7){top:35%;right:2%;background:var(--ter);box-shadow:0 0 4px var(--ter);width:3px;height:3px}

/* Progress ring */
.progress-wrap{position:relative;width:140px;height:140px;margin-top:-8px}
.progress-ring{transform:rotate(-90deg)}
.progress-ring circle{fill:none;stroke-linecap:round}
.progress-ring .track{stroke:var(--border);stroke-width:2}
.progress-ring .fill{stroke:var(--accent);stroke-width:2.5;stroke-dasharray:408;stroke-dashoffset:408;transition:stroke-dashoffset .3s ease;filter:drop-shadow(0 0 6px rgba(0,240,255,.5))}
.progress-pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--fm);font-size:26px;font-weight:500;color:var(--accent);text-shadow:0 0 12px rgba(0,240,255,.4)}

/* Status ticker */
.ticker{font-family:var(--fm);font-size:13px;color:var(--fg2);text-align:center;height:20px;position:relative;width:240px}
.ticker-inner{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .5s ease}
.ticker-inner.show{opacity:1}

.scanline{position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:0;animation:scan 4s ease-in-out infinite 1s}

@keyframes breathe{0%,100%{text-shadow:0 0 40px rgba(0,240,255,.3),0 0 80px rgba(0,240,255,.1)}50%{text-shadow:0 0 60px rgba(0,240,255,.6),0 0 120px rgba(0,240,255,.3)}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes scan{0%{top:0;opacity:0}10%{opacity:.6}90%{opacity:.6}100%{top:100%;opacity:0}}
</style>
</head>
<body>
<div class="device">
  <div class="scanline"></div>
  <div class="status-bar">
    <span id="time">12:00</span>
    <span style="display:flex;gap:6px;align-items:center">
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><path d="M1 8h2v4H1zM5 5h2v7H5zM9 3h2v9H9zM13 0h2v12h-2z" fill="currentColor" opacity=".6"/></svg>
      <svg width="22" height="12" viewBox="0 0 22 12" fill="none"><rect x=".5" y=".5" width="18" height="11" rx="2" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="14" height="8" rx="1" fill="var(--ter)" opacity=".8"/><path d="M20 4v4a2 2 0 000-4z" fill="currentColor" opacity=".4"/></svg>
    </span>
  </div>

  <div class="splash">
    <div class="logo-wrap">
      <div class="particles" id="particles">
        <div class="particle"></div><div class="particle"></div><div class="particle"></div>
        <div class="particle"></div><div class="particle"></div><div class="particle"></div><div class="particle"></div>
      </div>
      <div class="ring ring-1" id="r1"></div>
      <div class="ring ring-2" id="r2"></div>
      <div class="ring ring-3" id="r3"></div>
      <span class="logo-text">ARIN</span>
    </div>
    <div class="progress-wrap">
      <svg class="progress-ring" width="140" height="140" viewBox="0 0 140 140">
        <circle class="track" cx="70" cy="70" r="65"/>
        <circle class="fill" id="fill" cx="70" cy="70" r="65"/>
      </svg>
      <div class="progress-pct" id="pct">0%</div>
    </div>
    <div class="ticker" id="tickerWrap">
      <div class="ticker-inner show" id="ticker">Initializing systems...</div>
    </div>
  </div>

  <div class="gesture-bar"></div>
</div>
<script>
(function(){
  var C=2*Math.PI*65,fill=document.getElementById('fill'),pct=document.getElementById('pct'),
      tickerWrap=document.getElementById('tickerWrap'),ticker=document.getElementById('ticker'),
      particles=document.querySelectorAll('.particle'),
      r1=document.getElementById('r1'),r2=document.getElementById('r2'),r3=document.getElementById('r3');
  fill.style.strokeDasharray=C;fill.style.strokeDashoffset=C;

  var msgs=['Waking local model...','Linking Arduino...','Connecting to cloud...','Systems ready'],
      prog=0,mi=0;

  /* stagger ring + particle appearance */
  setTimeout(function(){r1.classList.add('on')},300);
  setTimeout(function(){r2.classList.add('on')},800);
  setTimeout(function(){r3.classList.add('on')},1400);
  particles.forEach(function(p,i){setTimeout(function(){p.classList.add('on')},600+i*200)});

  ticker.classList.add('show');

  var iv=setInterval(function(){
    prog+=Math.random()*3+1;if(prog>100)prog=100;
    fill.style.strokeDashoffset=C-(prog/100)*C;
    pct.textContent=Math.round(prog)+'%';
    var n=Math.min(Math.floor(prog/28),msgs.length-1);
    if(n!==mi){
      mi=n;
      ticker.style.opacity='0';
      setTimeout(function(){
        ticker.textContent=msgs[mi];
        ticker.style.opacity='1';
      },300);
    }
    if(prog>=100){
      clearInterval(iv);
      setTimeout(function(){window.location.href='onboarding.html'},1200);
    }
  },120);

  var now=new Date();
  document.getElementById('time').textContent=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
})();
</script>
</body>
</html>
